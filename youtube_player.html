<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #player-wrap {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* ── VideoJS core overrides ───────────────────────────────────────── */
    .video-js {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    /* The YouTube iframe VideoJS injects */
    .vjs-tech {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    /* Kill every black overlay VideoJS adds */
    .vjs-poster,
    .vjs-text-track-display,
    .vjs-modal-dialog,
    .vjs-loading-spinner {
      display: none !important;
      background: transparent !important;
    }

    .vjs-control-bar {
      background: linear-gradient(transparent, rgba(0,0,0,0.55)) !important;
      z-index: 10;
    }

    .vjs-big-play-button {
      background: rgba(0,0,0,0.35) !important;
      border: 2px solid rgba(255,255,255,0.6) !important;
      border-radius: 50% !important;
    }

    /* ── Status overlay ───────────────────────────────────────────────── */
    #status {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.72);
      color: #fff;
      font-family: sans-serif;
      font-size: 15px;
      text-align: center;
      padding: 18px 28px;
      border-radius: 10px;
      z-index: 999;
      pointer-events: none;
      line-height: 1.6;
    }
  </style>

  <!-- VideoJS -->
  <link  href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video-js.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video.min.js"></script>
  <!-- VideoJS YouTube tech -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-youtube/3.0.1/Youtube.min.js"></script>
</head>
<body>

<div id="player-wrap">
  <video id="player"
         class="video-js vjs-default-skin"
         controls autoplay playsinline preload="none">
  </video>
</div>

<div id="status"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   State
═══════════════════════════════════════════════════════════════════════ */
var player          = null;
var currentVideoId  = '';
var currentChanId   = '';
var isLive          = false;
var retryCount      = 0;
var MAX_RETRIES     = 5;
var retryTimer      = null;
var stallTimer      = null;

/* ═══════════════════════════════════════════════════════════════════════
   Entry point — called from Android via evaluateJavascript()
═══════════════════════════════════════════════════════════════════════ */
function loadVideo(videoId, channelId, live) {
  currentVideoId = videoId;
  currentChanId  = channelId;
  isLive         = live;
  retryCount     = 0;
  startPlayer(videoId);
}

/* ═══════════════════════════════════════════════════════════════════════
   Player bootstrap
═══════════════════════════════════════════════════════════════════════ */
function startPlayer(videoId) {
  clearTimers();
  showStatus('');

  // Dispose previous instance and recreate <video> element
  if (player) {
    try { player.dispose(); } catch (e) {}
    player = null;
  }
  var wrap   = document.getElementById('player-wrap');
  wrap.innerHTML = '';
  var vid    = document.createElement('video');
  vid.id     = 'player';
  vid.className = 'video-js vjs-default-skin';
  vid.setAttribute('controls', '');
  vid.setAttribute('autoplay', '');
  vid.setAttribute('playsinline', '');
  vid.setAttribute('preload', 'none');
  wrap.appendChild(vid);

  // Build YouTube watch URL — always use direct video URL, never channel/live URL
  // This is the most reliable embed method for both live and VOD
  var ytSrc = videoId
    ? 'https://www.youtube.com/watch?v=' + videoId
    : '';

  if (!ytSrc) {
    // No videoId at all — tell Android to fetch one
    notifyError('no_video_id');
    return;
  }

  player = videojs('player', {
    techOrder : ['youtube'],
    sources   : [{ type: 'video/youtube', src: ytSrc }],
    youtube   : {
      /* These params match what YouTube expects for embedded players */
      autoplay        : 1,
      controls        : 1,
      rel             : 0,
      modestbranding  : 1,
      iv_load_policy  : 3,       // hide annotations
      playsinline     : 1,
      enablejsapi     : 1,
      /* origin MUST match the page's origin so YouTube accepts the embed */
      origin          : 'https://www.youtube.com',
      /* ytControls=0 → VideoJS draws its own controls on top of iframe */
      ytControls      : 0,
      /* ── Critical for live streams ── */
      /* isLive hint tells the YouTube tech not to treat it as a VOD */
      isLive          : isLive
    },
    autoplay   : true,
    controls   : true,
    fluid      : false,
    fill       : true,
    responsive : false
  });

  /* ── After player is ready, strip any remaining black layers ── */
  player.ready(function () {
    fixTransparency();
    player.play().catch(function () {});

    // Stall watchdog for live streams only
    if (isLive) {
      stallTimer = setTimeout(function () {
        var s = player ? player.readyState() : 0;
        if (s < 2) {          // HAVE_CURRENT_DATA not reached
          onStreamError('stall_timeout');
        }
      }, 20000);
    }
  });

  /* ── Playback events ── */
  player.on('playing', function () {
    clearTimers();
    showStatus('');
    fixTransparency();
    try { AndroidBridge.onPlaying(); } catch(e) {}
  });

  player.on('error', function () {
    var code = player && player.error() ? player.error().code : -1;
    onStreamError('vjs_error_' + code);
  });

  /* Detect YouTube iframe error 1150 / "Video unavailable" via postMessage */
  window.addEventListener('message', onYouTubeMessage, false);
}

/* ═══════════════════════════════════════════════════════════════════════
   YouTube postMessage listener
   YouTube's iframe player posts error codes back to the parent window.
   Error 1150 = private/geo-blocked live stream.
   Error 100  = video not found / removed.
   Error 150  = embed not allowed by owner.
═══════════════════════════════════════════════════════════════════════ */
function onYouTubeMessage(e) {
  try {
    var data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    if (!data || data.event !== 'infoDelivery') return;
    var info = data.info || {};

    // playerState -1 = unstarted, 0 = ended
    if (info.playerState === -1 && isLive) {
      // Give it 8s to start; if still unstarted → treat as error 1150
      if (!stallTimer) {
        stallTimer = setTimeout(function () {
          if (player && player.paused()) {
            onStreamError('yt_state_unstarted');
          }
        }, 8000);
      }
    }

    // YouTube error object inside postMessage
    if (info.error) {
      onStreamError('yt_error_' + info.error);
    }
  } catch (ex) { /* ignore parse errors */ }
}

/* ═══════════════════════════════════════════════════════════════════════
   Error / retry logic
═══════════════════════════════════════════════════════════════════════ */
function onStreamError(reason) {
  clearTimers();

  if (!isLive) {
    // For VOD just report — no retry loop
    notifyError(reason);
    return;
  }

  if (retryCount >= MAX_RETRIES) {
    showStatus('');
    notifyError('max_retries:' + reason);
    return;
  }

  retryCount++;
  var delay = retryCount <= 2 ? 4000 : 8000;   // faster first retries
  showStatus('⏳ Reconnecting... (' + retryCount + '/' + MAX_RETRIES + ')');

  retryTimer = setTimeout(function () {
    // Ask Android for a fresh videoId (cache-only, no network)
    var freshId = '';
    try { freshId = AndroidBridge.getFreshVideoId(currentChanId) || ''; } catch(e) {}

    if (freshId && freshId !== currentVideoId) {
      // We have a new videoId from Android's cache — use it
      currentVideoId = freshId;
      startPlayer(freshId);
    } else {
      // Same ID or nothing — tell Android to hit the API
      notifyError('need_fresh_id:' + reason);
    }
  }, delay);
}

function notifyError(reason) {
  try { AndroidBridge.onPlayerError(reason); } catch(e) {}
}

/* ═══════════════════════════════════════════════════════════════════════
   Helpers
═══════════════════════════════════════════════════════════════════════ */
function fixTransparency() {
  // Called after player.ready() and on 'playing' to strip black overlays
  setTimeout(function () {
    var tech = document.querySelector('.vjs-tech');
    if (tech) {
      tech.style.background      = 'transparent';
      tech.style.backgroundColor = 'transparent';
      tech.setAttribute('allowtransparency', 'true');
    }
    ['vjs-poster','vjs-overlay','vjs-loading-spinner'].forEach(function(cls) {
      document.querySelectorAll('.' + cls).forEach(function(el) {
        el.style.display = 'none';
      });
    });
  }, 300);
}

function showStatus(msg) {
  var el = document.getElementById('status');
  if (!el) return;
  if (msg) { el.innerText = msg; el.style.display = 'block'; }
  else      { el.style.display = 'none'; }
}

function clearTimers() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; }
  window.removeEventListener('message', onYouTubeMessage, false);
}
</script>

</body>
</html>
