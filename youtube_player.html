<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Make VideoJS container truly fullscreen */
    #player {
      position: absolute;
      top: 0; left: 0;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    /* VideoJS overrides — remove black overlays */
    .video-js {
      position: absolute !important;
      top: 0; left: 0;
      width: 100% !important;
      height: 100% !important;
      background-color: transparent !important;
    }

    /* The actual video element inside VideoJS */
    .video-js video,
    .video-js iframe,
    .vjs-tech {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      object-fit: fill !important;
    }

    /* Hide the black poster/loading overlay */
    .vjs-poster {
      background-color: transparent !important;
      display: none !important;
    }

    /* Hide the loading spinner black background */
    .vjs-loading-spinner {
      display: none !important;
    }

    /* Remove black background from control bar area */
    .vjs-control-bar {
      background: linear-gradient(transparent, rgba(0,0,0,0.5)) !important;
    }

    /* Hide big play button black circle */
    .vjs-big-play-button {
      background-color: rgba(0,0,0,0.4) !important;
      border: none !important;
    }

    /* YouTube iframe inside VideoJS — must be transparent */
    .vjs-youtube iframe,
    .vjs-tech iframe {
      background: transparent !important;
    }

    #status {
      position: absolute;
      bottom: 30px;
      left: 0; right: 0;
      text-align: center;
      color: #aaa;
      font-family: sans-serif;
      font-size: 14px;
      pointer-events: none;
      z-index: 999;
    }
  </style>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video-js.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-youtube/3.0.1/Youtube.min.js"></script>
</head>
<body>

<video
        id="player"
        class="video-js vjs-default-skin"
        controls
        autoplay
        playsinline
        preload="auto">
</video>

<div id="status"></div>

<script>
    var player;
    var retryCount       = 0;
    var maxRetries       = 3;
    var currentVideoId   = '';
    var currentChannelId = '';
    var isLive           = false;

    function loadVideo(videoId, channelId, live) {
      currentVideoId   = videoId;
      currentChannelId = channelId;
      isLive           = live;
      retryCount       = 0;
      startPlayer(videoId, channelId, live);
    }

    function startPlayer(videoId, channelId, live) {
      setStatus('Loading...');

      if (player) {
        try { player.dispose(); } catch(e) {}
        player = null;

        var newVideo = document.createElement('video');
        newVideo.id        = 'player';
        newVideo.className = 'video-js vjs-default-skin';
        newVideo.setAttribute('controls', '');
        newVideo.setAttribute('autoplay', '');
        newVideo.setAttribute('playsinline', '');
        newVideo.setAttribute('preload', 'auto');
        document.body.insertBefore(newVideo, document.getElementById('status'));
      }

      var ytUrl = videoId
        ? 'https://www.youtube.com/watch?v=' + videoId
        : 'https://www.youtube.com/channel/' + channelId + '/live';

      player = videojs('player', {
        techOrder:  ['youtube'],
        sources: [{ type: 'video/youtube', src: ytUrl }],
        youtube: {
          iv_load_policy: 3,
          modestbranding: 1,
          rel:            0,
          autoplay:       1,
          origin:         'https://www.youtube.com',
          // KEY FIX: disable ytControls so VideoJS controls sit on top cleanly
          ytControls:     0
        },
        autoplay:    true,
        controls:    true,
        fluid:       false,
        responsive:  false,
        // KEY FIX: no black fill behind video
        fill:        true,
        aspectRatio: undefined
      });

      player.ready(function() {
        // KEY FIX: force iframe background transparent after player is ready
        setTimeout(function() {
          var iframe = document.querySelector('.vjs-tech');
          if (iframe) {
            iframe.style.background      = 'transparent';
            iframe.style.backgroundColor = 'transparent';
            iframe.setAttribute('allowtransparency', 'true');
          }
          // Also remove any black div overlays VideoJS injects
          var overlays = document.querySelectorAll('.vjs-poster, .vjs-overlay');
          overlays.forEach(function(el) { el.style.display = 'none'; });
        }, 500);

        player.play().catch(function() {});
      });

      player.on('playing', function() {
        setStatus('');
        // Hide any remaining overlays once video actually plays
        var overlays = document.querySelectorAll('.vjs-poster, .vjs-loading-spinner');
        overlays.forEach(function(el) { el.style.display = 'none'; });
        AndroidBridge.onPlaying();
      });

      player.on('error', function() {
        var err  = player.error();
        var code = err ? err.code : -1;
        handleError('error_code_' + code);
      });

      player.on('stalled', function() {
        if (isLive) {
          setTimeout(function() {
            if (player && player.paused()) handleError('stalled');
          }, 10000);
        }
      });

      player.on('waiting', function() {
        if (isLive) {
          setTimeout(function() {
            if (player && player.readyState() < 3) handleError('waiting_timeout');
          }, 15000);
        }
      });
    }

    function handleError(reason) {
      if (!isLive) {
        AndroidBridge.onPlayerError(reason);
        return;
      }

      if (retryCount < maxRetries) {
        retryCount++;
        setStatus('Reconnecting... (' + retryCount + '/' + maxRetries + ')');
        setTimeout(function() {
          var freshId = AndroidBridge.getFreshVideoId(currentChannelId);
          if (freshId && freshId.length > 0) currentVideoId = freshId;
          startPlayer(currentVideoId, currentChannelId, true);
        }, 3000);
      } else {
        setStatus('');
        AndroidBridge.onPlayerError('max_retries_reached');
      }
    }

    function setStatus(msg) {
      var el = document.getElementById('status');
      if (el) el.innerText = msg;
    }
  </script>

</body>
</html>
