<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <title>Live TV Player</title>
  <link href="https://unpkg.com/video.js@8.23.4/dist/video-js.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <header class="bg-[#121212] text-gray-100 py-4 px-6 flex justify-between items-center shadow-lg sticky top-0 z-10">
    <div class="flex items-center space-x-4">
      <img src="logo.svg" alt="logo" class="h-10 w-10">
      <h1 class="text-2xl font-bold">LiveTV Player</h1>
    </div>
    <nav class="flex items-center space-x-4">
      <a href="admin.html" class="flex items-center text-gray-300 hover:text-white transition-colors duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          class="w-5 h-5 mr-1">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
        </svg>
        Admin
      </a>
    </nav>

  </header>

  <main>


    <div class="container">
        <!-- Log Area -->
        <div>
            <div id="logArea" class="text-white-400 p-4 h-40 overflow-y-scroll rounded-lg text-sm whitespace-pre-wrap">
                Press **Left/Right** to navigate, **Enter** to play, **Enter** for fullscreen, and **Left** to close.
            </div>
        </div>

      <div id="channel-number-overlay">
      </div>

      <div id="recentlyWatched" class="section">
        <h2 class="text-xl font-bold mt-6 mb-4 col-span-full">Recently Watched</h2>
        <div class="content-grid" id="recentlyWatchedGrid"></div>
      </div>

      <div id="favorites" class="section">
        <h2 class="text-xl font-bold mt-6 mb-4 col-span-full">Favorites</h2>
        <div class="content-grid" id="favoritesGrid"></div>
      </div>


      <div id="loading-spinner"></div>



      <div id="channels" class="section">
        <div class="sort-container">
          <h2 class="text-xl font-bold mt-6 mb-4 col-span-full">All Channels</h2>

          <div class="sort-controls">
            <label for="sortChannels">Sort by:</label>
            <select id="sortChannels" class="sort-dropdown">
              <option value="none">None</option>
              <option value="asc">Name (A-Z)</option>
              <option value="desc">Name (Z-A)</option>
              <option value="watchTime">Watch Time</option>
            </select>
          </div>
        </div>
      </div>




  </main>

  <div id="videoModal" class="fixed inset-0 bg-black bg-opacity-90 flex justify-center items-center z-50 hidden">
    <div class="relative w-full h-full flex flex-col justify-center items-center">
      <span id=".closeModal" class="closeModal">&times;</span>

      <!-- New location for channel number overlay -->
      <div id="channel-number-overlay"></div>

      <div id="player-container">
        <div id="player"></div>



        <!-- Recent Channels Overlay -->
        <div id="recent-channel-overlay" class="recent-overlay">
          <div id="recentChannelsGrid" class="recent-grid">
            <!-- Recently watched channels will be rendered here -->
          </div>
        </div>
      </div>


      <div id="channel-info-overlay" class="channel-info-overlay">
        <div id="video-info-container" class="flex items-center space-x-4">
          <img id="content-image" alt="Content Image" class="w-16 h-16 rounded-full shadow-md">

          <div class="text-white">

            <h2 class="text-xl font-bold mt-6 mb-4 col-span-full">
              <span id="channel-number"></span>
              <span id="video-title"></span>
              <span id="video-quality"></span>
              <span id="live_span">Live</span>
            </h2>

            <p id="channel-description" class="text-gray-300 text-sm"></p>
          </div>

        </div>
      </div>
    </div>

    <button id="retryButton" class="bg-red-600 text-white font-semibold py-2 px-4 rounded-lg mt-4 hidden">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"
          clip-rule="evenodd" />
      </svg>
      Retry
    </button>
  </div>
  </div>

  <footer class="bg-[#121212] text-gray-400 text-center py-4 px-6 mt-auto shadow-inner">
    <p>&copy; 2025 All Rights Reserved.</p>
  </footer>

  <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-youtube@3.0.1/dist/Youtube.min.js"></script>

  <script src="script.js"></script>

</body>

</html>
